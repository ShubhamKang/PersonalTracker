services:
  db:
    image: postgres:16-alpine
    container_name: personal-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker_dev_pw
      POSTGRES_DB: personal_tracker
    ports:
      - "5432:5432"
    volumes:
      - tracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d personal_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tracker_pgdata:
