# Render Blueprint — free-tier backend deploy.
# Docs: https://render.com/docs/blueprint-spec
#
# NOTE ON FREE TIER: Render's free web service sleeps after ~15 min of
# inactivity and cold-starts (~30s) on the next request. While asleep the
# 15-min notification cron does not run. Acceptable for a personal app.
#
# DATABASE: We use a free Neon Postgres (https://neon.tech) instead of
# Render's managed Postgres because Render's free DB expires after 30 days.
# Paste your Neon connection string into DATABASE_URL via the dashboard.

services:
  - type: web
    name: personal-tracker-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: GOOGLE_CLIENT_SECRET
        value: ""
